<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hénōsis</title>
<style>
:root,[data-theme="dark"]{--bg:#14151a;--card:#1d1f27;--line:#2c2f3a;--text:#e9e9ee;--dim:#9a9cab;--accent:#ff8a3d;--ok:#4cc38a;--warn:#f2c14e;--bad:#ef6461;--blue:#6aa9ff;--btn-bg:#2a2d39;--input-bg:#12131a;--note-bg:#262019;--note-border:#4a3b22;--console-bg:#0d0e12;--target-bg:#22201a;--drop-over-bg:#221c14;--log-debug:#6f7285;--log-info:#cfd0da;--btn-main-text:#1a1206;--shadow:0 4px 12px rgba(0,0,0,.5);--danger-border:#5a2b2b}
[data-theme="light"]{--bg:#F8FAFC;--card:#FFFFFF;--line:#BCCCDC;--text:#1a2332;--dim:#5a6b7d;--accent:#2563eb;--ok:#059669;--warn:#d97706;--bad:#dc2626;--blue:#0891b2;--btn-bg:#D9EAFD;--input-bg:#FFFFFF;--note-bg:#FEF3C7;--note-border:#FCD34D;--console-bg:#F1F5F9;--target-bg:#DBEAFE;--drop-over-bg:#DBEAFE;--log-debug:#9AA6B2;--log-info:#334155;--btn-main-text:#FFFFFF;--shadow:0 4px 12px rgba(15,23,42,.15);--danger-border:#FCA5A5}
[data-theme="teal"]{--bg:#2B2D33;--card:#3F4147;--line:#52555D;--text:#E8E8E8;--dim:#A8A8A8;--accent:#0DB5AA;--ok:#0DB5AA;--warn:#f2c14e;--bad:#ef6461;--blue:#0A7E7A;--btn-bg:#52555D;--input-bg:#25272C;--note-bg:#3A3530;--note-border:#5C4A3E;--console-bg:#1F2126;--target-bg:#0A3E3B;--drop-over-bg:#0A3E3B;--log-debug:#8E8E8E;--log-info:#cfd0da;--btn-main-text:#0A1F1D;--shadow:0 4px 12px rgba(0,0,0,.4);--danger-border:#6a3030}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
h1{font-size:26px;margin:0;letter-spacing:.5px}h1 span{color:var(--accent)}
header .who{margin-left:auto;color:var(--dim);font-size:13px;text-align:right}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:30px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.top{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--dim)}
.synced .dot{background:var(--ok)}.editing .dot{background:var(--accent)}.syncing .dot{background:var(--blue);animation:pulse 1.2s infinite}
.waiting .dot,.attention .dot{background:var(--warn)}.problem .dot{background:var(--bad)}.offline .dot{background:var(--dim)}
@keyframes pulse{50%{opacity:.35}}
.name{font-size:18px;font-weight:600}.headline{margin-left:auto;font-weight:600;text-align:right}
.detail{color:var(--dim);margin:8px 0 0 24px}.folder{color:var(--dim);font-size:12.5px;margin:6px 0 0 24px;word-break:break-all}
.note{margin:10px 0 0 24px;padding:9px 12px;border-radius:8px;background:var(--note-bg);border:1px solid var(--note-border);font-size:14px}
.note ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:13px;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0 24px}
button{font:inherit;font-size:13.5px;color:var(--text);background:var(--btn-bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--dim)}button.main{background:var(--accent);border-color:var(--accent);color:var(--btn-main-text);font-weight:600}
button.quiet{background:none;color:var(--dim)}button:disabled{opacity:.5;cursor:default}
input{font:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
td.when{color:var(--dim);white-space:nowrap}.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--dim);margin-left:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn-bg);border:1px solid var(--line);border-radius:10px;padding:10px 16px;max-width:90vw;display:none}
#toast.bad{border-color:var(--bad)}
.meta{color:var(--dim);font-size:12.5px;margin:10px 0 0 24px}
.code{font:600 20px/1.3 Consolas,monospace;letter-spacing:1px;color:var(--accent);user-select:all}
small{color:var(--dim)}
main{padding-bottom:40px}
body{padding-bottom:300px}
#console{position:fixed;left:0;right:0;bottom:0;background:var(--console-bg);border-top:1px solid var(--line);font:12.5px/1.45 Consolas,"Cascadia Mono",monospace}
#grip{height:7px;cursor:ns-resize;background:transparent}#grip:hover,#grip.dragging{background:var(--line)}
#console.closed #grip{display:none}
#console .bar{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-family:"Segoe UI",system-ui,sans-serif;font-size:12.5px;color:var(--dim)}
#console .bar b{color:var(--text);font-weight:600}#console .bar label{margin:0 0 0 auto;display:flex;gap:5px;align-items:center;font-size:12.5px}
#console .bar input{width:auto}#console .bar button{font-size:12px;padding:3px 9px}
#lines{height:180px;overflow-y:auto;padding:6px 12px;white-space:pre-wrap;word-break:break-word}
#console.closed #lines{display:none}
#lines div.error{color:var(--bad)}#lines div.debug{color:var(--log-debug)}#lines div.info{color:var(--log-info)}#lines span{color:var(--log-debug)}
#count{color:var(--bad);font-weight:600}
.addr{font:600 15px/1.6 Consolas,monospace;color:var(--accent);user-select:all}
.token{font:13px/1.4 Consolas,monospace;color:var(--accent);word-break:break-all;user-select:all}
.inline{display:flex;gap:8px}.inline input{flex:1}
#toast{bottom:270px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media(max-width:1020px){.layout{grid-template-columns:1fr}}
main{max-width:1240px}
.welcome{max-width:520px;margin:30px auto 0}
.welcome h2{margin:0 0 6px;font-size:20px;text-transform:none;letter-spacing:0;color:var(--text)}
.big{width:100%;padding:11px;font-size:15px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);margin:22px 0 6px;font-size:13px}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.codebox{font:600 15px/1.5 Consolas,monospace;color:var(--accent);background:var(--input-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;word-break:break-all;user-select:all;margin-top:10px}
details{margin-top:14px;color:var(--dim);font-size:13.5px}summary{cursor:pointer}
.card.pick{cursor:pointer}.card.sel{border-color:var(--accent)}
.side{position:sticky;top:16px}
.ver{border-top:1px solid var(--line);padding:10px 0}.ver:first-child{border-top:0}
.ver .msg{font-weight:600}.ver .by{color:var(--dim);font-size:12.5px;margin-top:2px}
.ver .c{margin:6px 0 0 10px;padding-left:10px;border-left:2px solid var(--line);font-size:13.5px}.ver .c b{color:var(--accent);font-weight:600}
.ver .acts{margin-top:6px;display:flex;gap:6px}.ver .acts button{font-size:12px;padding:3px 9px}
.ver.target{background:var(--target-bg);margin:0 -10px;padding:10px;border-radius:8px}
#versions{max-height:46vh;overflow-y:auto;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.help{color:var(--dim);font-size:13.5px;margin:-4px 0 12px}
#drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;transition:border-color .15s,background .15s}
#drop.over{border-color:var(--accent);background:var(--drop-over-bg)}
#drop .big{margin:0 0 10px}
body.dragging #drop{border-color:var(--accent)}
details.paste{margin-top:10px}
.step{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:var(--dim);font-size:13.5px}
.step b{display:flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px;border-radius:50%;background:var(--btn-bg);color:var(--text);font-size:12px}
.danger{color:var(--bad);border-color:var(--danger-border)}
.danger:hover{border-color:var(--bad)}
h2 .hint{float:right;text-transform:none;letter-spacing:0;font-weight:400}
.toggles{display:flex;gap:16px;margin:10px 0 0 24px;font-size:13px;color:var(--dim)}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;margin:0}
.toggles input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.acts-main{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 24px;align-items:center}
.logo{width:28px;height:28px;color:var(--accent);flex:none;vertical-align:middle}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--btn-bg);border:1px solid var(--line);color:var(--dim);font-size:10px;cursor:help;flex:none;font-weight:700;font-family:system-ui;user-select:none}
.tip:hover{color:var(--text);border-color:var(--dim)}
.tip .tt{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--btn-bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--text);white-space:normal;width:210px;font-weight:400;z-index:100;pointer-events:none;box-shadow:var(--shadow);line-height:1.4}
.tip:hover .tt,.tip.show .tt{display:block}
.tip .tt::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--line)}
.toggles{align-items:center}
.toggles .tip{margin-right:6px}
.themes{display:flex;gap:6px;margin-right:10px;align-items:center}
.themes button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--line);cursor:pointer;position:relative;overflow:hidden;background:none}
.themes button:hover{border-color:var(--dim)}
.themes button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.themes button[data-set="dark"]{background:linear-gradient(135deg,#14151a 50%,#ff8a3d 50%)}
.themes button[data-set="light"]{background:linear-gradient(135deg,#F8FAFC 50%,#2563eb 50%)}
.themes button[data-set="teal"]{background:linear-gradient(135deg,#2B2D33 50%,#0DB5AA 50%)}
header{align-items:center}
body{transition:background .15s,color .15s}

/* --- 0.7 layout ------------------------------------------------------- */
[data-theme="dark"],:root{--panel:#0e0f13;--led-off:#2a2c35}
[data-theme="light"]{--panel:#E6EDF5;--led-off:#C9D3DE}
[data-theme="teal"]{--panel:#232529;--led-off:#45484f}
header{margin-bottom:18px}
header .hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px}
header .who{margin:0}
header .themes{margin:0}
h2{text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;color:var(--text);margin:26px 0 10px}
h2 .hint{color:var(--dim);font-size:13px}

/* LEDs: the status light of a project or of the whole session, like a
   mixer channel's. Lit ones glow; a syncing one blinks. */
.led{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--led-off);flex:none}
.led.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.led.accent{background:var(--accent);box-shadow:0 0 7px var(--accent)}
.led.warn{background:var(--warn);box-shadow:0 0 7px var(--warn)}
.led.bad{background:var(--bad);box-shadow:0 0 7px var(--bad)}
.led.blue{background:var(--blue);box-shadow:0 0 7px var(--blue);animation:pulse 1.2s infinite}
@media (prefers-reduced-motion:reduce){.led.blue,.syncing .dot{animation:none}}

/* The transport bar: the session at a glance, across the top. */
.transport{position:relative;display:flex;flex-wrap:wrap;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.transport .seg{display:flex;align-items:center;gap:9px;padding:11px 16px;border-right:1px solid var(--line);font-size:13.5px;min-height:52px}
.transport .seg:last-child{border-right:0}
.transport .seg small{display:block;font-size:11.5px;color:var(--dim);line-height:1.2}
.transport .seg b{font-weight:600;color:var(--text);display:block;line-height:1.25}
.transport .grow{margin-left:auto}
.transport code{font:600 13px Consolas,"Cascadia Mono",monospace;color:var(--accent);letter-spacing:.5px}
.transport details{margin:0;color:var(--text)}
.transport details>summary{list-style:none;cursor:pointer;font-size:13.5px;color:var(--dim);padding:4px 2px}
.transport details>summary::-webkit-details-marker{display:none}
.transport details>summary:hover,.transport details[open]>summary{color:var(--text)}
.transport .panel{position:absolute;right:-1px;top:calc(100% + 6px);width:min(560px,calc(100vw - 40px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;z-index:50;box-shadow:var(--shadow);color:var(--dim);font-size:13.5px}

/* Project cards: status first, one main action, the rest in a menu. */
.card.pick{padding:14px 18px}
.card .top{flex-wrap:wrap;row-gap:8px}
.card .top .led{margin-right:2px}
.card .top .name{font-size:17px}
.card .top .headline{margin-left:0;font-weight:500;color:var(--dim);font-size:13.5px;text-align:left}
.card .top .acts-main{margin:0 0 0 auto}
.card .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin:8px 0 0 22px;color:var(--dim);font-size:12.5px}
.card .sub .folder{margin:0;font-size:12.5px}
.card .sub a{color:var(--dim)}
.card .toggles{margin:0;gap:12px}
.card .detail,.card .note,.card .row{margin-left:22px}
.synced .headline{color:var(--ok)!important}
.problem .headline{color:var(--bad)!important}
.waiting .headline,.attention .headline{color:var(--warn)!important}

.layout>div>h2:first-child{margin-top:4px}
#progress{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(3px)}
#progress[hidden]{display:none}
#progress .box{width:min(420px,calc(100vw - 40px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;text-align:center;box-shadow:var(--shadow)}
#progress .logo{width:44px;height:44px;animation:spin 2.4s linear infinite}
#progress b{display:block;font-size:18px;margin:14px 0 6px}
#progress .pstep{color:var(--dim);font-size:14px;min-height:21px}
#progress small{display:block;margin-top:12px;font-size:12px}
#progress .hint{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--text);text-align:left}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#progress .logo{animation:none}}
.prev{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;color:var(--dim)}
.prev b{color:var(--text);display:block;margin-bottom:2px}
.addcard{margin-top:6px;padding:14px 18px}
.addcard #drop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;text-align:left;padding:14px 16px;border-width:1.5px}
.addcard #drop .help{margin:0}
.addcard #addProject{border-color:var(--accent);color:var(--accent);font-weight:600}

/* The ⋯ menu on a card. */
details.more{position:relative;margin:0;color:var(--text)}
details.more>summary{list-style:none;cursor:pointer;width:32px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--btn-bg);font-size:16px;line-height:1;letter-spacing:1px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:hover,details.more[open]>summary{border-color:var(--dim)}
details.more .menu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:40;box-shadow:var(--shadow);display:flex;flex-direction:column}
details.more .menu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;font-size:13.5px}
details.more .menu button:hover{background:var(--btn-bg)}
details.more .menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
details.more .menu .danger{color:var(--bad)}

/* The console: a status strip until you open it. */
#console .bar{cursor:pointer;min-height:38px}
#console .bar button,#console .bar label{cursor:pointer}
#lastLine{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12.5px Consolas,"Cascadia Mono",monospace;color:var(--dim)}
#console:not(.closed) #lastLine{visibility:hidden}
#console.closed #detail,#console.closed #copyLog,#console.closed #clearLog,#console.closed label{display:none}
body:has(#console.closed){padding-bottom:64px}
body:has(#console.closed) #toast{bottom:58px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:1020px){.transport .grow{margin-left:0;flex:1}}
@media(max-width:700px){.transport .seg{border-right:0;border-bottom:1px solid var(--line);width:100%}.transport .grow{margin-left:0}.card .top .acts-main{margin-left:22px}}

</style>

<body>
<main>
<header><svg class="logo" viewBox="0 0 100 100"><polygon fill="currentColor" points="36.3,5.1 63.7,5.1 59.4,37.1 88.5,23.0 97.0,49.2 65.2,54.9 87.5,78.3 65.3,94.4 50.0,66.0 34.7,94.4 12.5,78.3 34.8,54.9 3.0,49.2 11.5,23.0 40.6,37.1"/></svg><h1>Hén<span>ō</span>sis</h1><div class="hdr-right"><div class="who" id="who"></div><div class="themes" id="themes" title="Color theme"><button data-set="dark" title="Dark theme" aria-label="Dark theme"></button><button data-set="light" title="Light theme" aria-label="Light theme"></button><button data-set="teal" title="Teal theme" aria-label="Teal theme"></button></div></div></header>
<div id="app"></div>
</main>
<div id="toast"></div>
<div id="progress" hidden role="status" aria-live="polite"></div>
<div id="console" class="closed"><div id="grip" title="Drag to make the console taller or shorter"></div><div class="bar" id="consoleBar" title="What the app is doing"><b>Console</b><span id="count"></span><span id="lastLine"></span>
<label><input type="checkbox" id="detail"> show details</label>
<button id="copyLog">Copy</button><button id="clearLog">Clear</button><button id="toggleLog">Open</button></div><div id="lines"></div></div>
<script>
"use strict";
// Theme — read the saved choice and apply it before anything renders.
function applyTheme(name) {
  if (name !== "dark" && name !== "light" && name !== "teal") name = "dark";
  document.documentElement.setAttribute("data-theme", name);
  try { localStorage.setItem("henosis-theme", name); } catch (e) {}
  document.querySelectorAll("#themes button").forEach((b) => b.classList.toggle("sel", b.dataset.set === name));
}
let savedTheme = "dark";
try { savedTheme = localStorage.getItem("henosis-theme") || "dark"; } catch (e) {}
document.documentElement.setAttribute("data-theme", savedTheme);
let state = null, busy = false, selected = null, history = null, historyFor = null, commentOn = null, suggestions = [];
let logSeq = 0, logLines = [], errorsSeen = 0;
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clear = (...ids) => ids.forEach((id) => { const el = document.getElementById(id); if (el) el.value = ""; });
const val = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
function tip(text) { return `<span class="tip" tabindex="0">?<span class="tt">${esc(text)}</span></span>`; }

function toast(text, bad) {
  const t = $("#toast"); t.textContent = text; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", bad ? 9000 : 4000);
}
async function api(path, body) {
  const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Henosis": "1"}, body: JSON.stringify(body)};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Something went wrong");
  return data;
}
async function act(path, body, done) {
  if (busy) return; busy = true;
  try { const out = await api(path, body || {}); if (done) done(out); await refresh(true); loadHistory(); loadSuggestions(); }
  catch (e) { toast(e.message, true); }
  finally { busy = false; }
}
function ago(iso) {
  if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago"; return new Date(iso).toLocaleString();
}

// The page is built once per situation (signed out, in a session, hosting)
// and after that only the parts that show changing information are redrawn,
// and only when they actually changed. Fields you type in are never rebuilt.
let skeleton = "";
const drawn = {};
function put(id, html) { const el = document.getElementById(id); if (el && drawn[id] !== html) { el.innerHTML = html; drawn[id] = html; } }

// While joining or starting a session, a screen says what is happening,
// step by step, from the app's own log lines.
let pending = null;
const STEPS = [
  [/trying the relay/, "Not on the same network, so going through the relay…"],
  [/relay did not pair/, "The relay did not find your friend's app. Is Hénōsis open there?"],
  [/paired through the relay|found the session at/, "Found it. Signing you in…"],
  [/running on this computer|signed back in|account .* created/, "Almost there…"],
];
async function withProgress(title, first, work, hint) {
  pending = {title, first, hint, since: Date.now(), from: logSeq};
  drawProgress();
  const tick = setInterval(drawProgress, 500);
  try { await work(); } finally { clearInterval(tick); pending = null; drawProgress(); }
}
function drawProgress() {
  const el = $("#progress");
  if (!pending) { el.hidden = true; el.innerHTML = ""; return; }
  let step = pending.first;
  for (const l of logLines) {
    if (!l.seq || l.seq <= pending.from) continue;
    for (const [re, text] of STEPS) if (re.test(l.text)) step = text;
  }
  const secs = Math.floor((Date.now() - pending.since) / 1000);
  el.hidden = false;
  el.innerHTML = `<div class="box"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><polygon fill="currentColor" points="36.3,5.1 63.7,5.1 59.4,37.1 88.5,23.0 97.0,49.2 65.2,54.9 87.5,78.3 65.3,94.4 50.0,66.0 34.7,94.4 12.5,78.3 34.8,54.9 3.0,49.2 11.5,23.0 40.6,37.1"/></svg>
    <b>${esc(pending.title)}</b><div class="pstep">${esc(step)}</div>${pending.hint ? `<div class="hint">${esc(pending.hint)}</div>` : ""}<small>${secs < 2 ? "" : secs + " s" + (secs > 8 ? " · it can take up to half a minute" : "")}</small></div>`;
}

// One line and one light for all projects together: the worst state wins.
function syncSummary(projects) {
  if (!projects.length) return {led: "", text: "No projects yet"};
  const has = (st) => projects.some((p) => p.state === st);
  if (has("problem")) return {led: "bad", text: "Needs a look"};
  if (has("attention") || has("waiting")) return {led: "warn", text: "Waiting on something"};
  if (has("syncing")) return {led: "blue", text: "Syncing"};
  if (has("offline")) return {led: "", text: "Offline"};
  if (has("editing")) return {led: "accent", text: "Editing in FL Studio"};
  return {led: "ok", text: projects.length === 1 ? "Up to date" : `All ${projects.length} up to date`};
}

function render() {
  const mode = !state.signed_in ? "out" : state.host.running ? "hosting" : "in";
  if (mode !== skeleton) {
    skeleton = mode; for (const k in drawn) delete drawn[k];
    $("#app").innerHTML = mode === "out" ? signedOut() : signedIn(mode === "hosting");
  }
  put("who", state.signed_in ? `${esc(state.user)} on ${esc(state.device)}` : "");
  if (mode === "out") {
    const prev = state.previous_session;
    const plural = (n, one, many) => n === 0 ? `no ${many}` : `${n} ${n === 1 ? one : many}`;
    put("startArea", prev
      ? `<div class="row" style="margin-left:0"><button class="main big" id="startNew">Start a new session</button></div>
        <div class="prev"><b>Or continue the session already on this computer</b>
          <div>${esc(prev.people.join(", "))}, with ${plural(prev.projects, "project", "projects")}. Type your name from that list to come back as yourself.</div>
          <div class="row" style="margin:10px 0 0"><button id="startSession">Continue that session</button></div></div>`
      : `<div class="row" style="margin-left:0"><button class="main big" id="startSession">Start a session</button></div>`);
    return;
  }
  if (!state.projects.some((p) => p.project_id === selected)) selected = state.projects.length ? state.projects[0].project_id : null;
  const h = state.host;
  if (mode === "hosting") {
    put("sessionCode", esc(h.code));
    put("tCode", esc(h.code.length > 16 ? h.code.slice(0, 8) + "…" + h.code.slice(-6) : h.code));
    const others = h.accounts.filter((n) => n !== state.user);
    put("tPeople", `<div><small>In the session</small><b>${others.length ? ["you", ...others].map(esc).join(", ") : "Just you so far"}</b></div>`);
    put("tLink", `<div><small>Hosting</small><b>${h.relay ? "Reachable from anywhere" : "Same network or Tailscale"}</b></div>`);
    put("hostAddr", (h.addresses.length ? h.addresses.map((a) => `<div>${esc(a)}</div>`).join("") : "No network connection found.") + (h.extra ? `<div>extra: ${esc(h.extra)}</div>` : ""));
    put("hostData", `Projects are stored in ${esc(h.data_dir)}`);
    const relayIn = document.getElementById("relayUrl");
    if (relayIn && relayIn !== document.activeElement && relayIn.value !== (h.relay || "")) relayIn.value = h.relay || "";
    put("relayState", h.relay ? `Relay on: friends who cannot reach you directly will be paired through <b style="color:var(--text)">${esc(h.relay)}</b>.` : "Relay off. A friend needs to be on the same network, both of you on Tailscale, or an address added by hand.");
  } else {
    const viaRelay = String(state.server).startsWith("relay://");
    const people = [...new Set(state.projects.flatMap((p) => p.members || []))].filter((n) => n !== state.user);
    put("tPeople", `<div><small>In the session</small><b>${people.length ? "you, " + people.map(esc).join(", ") : "you"}</b></div>`);
    put("tLink", `<div><small>Connected</small><b>${viaRelay ? "Through the relay" : "Directly"}</b></div>`);
    put("joined", h.problem ? `<div class="note" style="margin:0 0 14px">Hosting on this computer failed: ${esc(h.problem)}.</div>` : "");
  }
  const sync = syncSummary(state.projects);
  const led = document.getElementById("tLed");
  if (led) led.className = "led " + sync.led;
  put("tSync", `<div><small>Sync</small><b>${esc(sync.text)}</b></div>`);
  put("projects", cards());
  put("projectsHint", state.projects.length > 1 ? "click one to see its history" : "");
  put("unlinked", state.unlinked.length ? `<h2>In the session, not on this computer<span class="hint">your friend added these, or you stopped syncing them</span></h2>` + state.unlinked.map((p) => `<div class="card"><div class="top"><div class="name">${esc(p.name)}</div><div class="headline"><button data-link="${p.id}">Download it</button></div></div></div>`).join("") : "");
  put("suggest", suggestions.length ? `<label>Or one of these, found in your FL Studio projects folder:</label><div class="chips">${suggestions.map((s, i) => `<button data-suggest="${i}" title="${esc(s.file)}">${esc(s.name)}${s.loose ? " (single file)" : ""}</button>`).join("")}</div>` : "");
  put("foot", `${state.autostart ? `<button class="quiet" id="autostart">${state.autostart === "on" ? "Do not start with Windows" : "Start with Windows"}</button>` : ""}<button class="quiet" id="logout">Leave the session</button><button class="quiet" id="quit">Quit Hénōsis</button><small style="margin-left:auto;align-self:center">version ${esc(state.version)}</small>`);
  renderHistory();
}

const ledFor = (st) => ({synced: "ok", editing: "accent", syncing: "blue", waiting: "warn", attention: "warn", problem: "bad"}[st] || "");
// The last two folders of a path, so a card shows where it lives without a
// line of C:\Users\…; the full path is in the tooltip.
function shortFolder(path) {
  const parts = String(path).split(/[\\/]/).filter(Boolean);
  return parts.length > 2 ? "…" + (String(path).includes("\\") ? "\\" : "/") + parts.slice(-2).join(String(path).includes("\\") ? "\\" : "/") : path;
}
let openMenu = null;

function cards() {
  if (!state.projects.length) return `<div class="card"><div class="detail" style="margin-left:0">No projects yet. Add one below${state.host.running ? "" : ", or wait for your friend to add one"}.</div></div>`;
  return state.projects.map((p) => {
    const b = [];
    if (p.confirm_delete) b.push(`<button class="main" data-act="confirm-delete" data-id="${p.project_id}">Yes, upload the removal</button>`);
    if (p.holding_lock && p.open_in_fl && p.shared) b.push(`<button ${p.lock_requested_by ? 'class="main"' : ""} data-act="yield" data-id="${p.project_id}" title="Your last save goes up first, then your friend can edit.">Let ${esc(p.members.filter((m) => m !== state.user)[0] || "your friend")} edit</button>`);
    if (p.yielded) b.push(`<button data-act="take" data-id="${p.project_id}">Take the project back</button>`);
    if (p.lock_holder && p.open_in_fl) b.push(`<button data-act="ask" data-id="${p.project_id}" title="${esc(p.lock_holder)} sees that you would like to edit.">Ask ${esc(p.lock_holder)} for it</button>`);
    if (p.lock_holder && p.role === "owner") b.push(`<button class="quiet" data-act="break" data-id="${p.project_id}" title="Only if their computer is gone." data-confirm="Take the project away from ${esc(p.lock_holder)}? Only do this if their computer is gone or crashed. Their unsent saves stay on their computer.">Break the lock</button>`);
    const id = p.project_id;
    // The one thing you usually want, then manual send/update only when the
    // automatic one is off, then everything else in the ⋯ menu.
    const mainBtns = [];
    if (p.gone) mainBtns.push(`<button class="main" data-act="unlink" data-id="${id}" title="Your files stay on this computer." data-confirm="Take this project off the list?\n\nThe folder and its files stay on this computer, untouched.">Remove from the list</button>`);
    else {
      mainBtns.push(`<button class="main" data-act="open-project" data-id="${id}">▶ Open in FL Studio</button>`);
      if (!p.auto_send) mainBtns.push(`<button data-act="send" data-id="${id}">⬆ Send changes</button>${tip("Auto-send is off, so your saves stay here until you press this. It uploads your latest save so your friend gets it.")}`);
      if (!p.auto_update) mainBtns.push(`<button data-act="update" data-id="${id}">⬇ Update now</button>${tip("Auto-update is off, so your friend's saves wait until you press this. It downloads the newest version and replaces your local file.")}`);
    }
    const menu = [`<button data-act="open-folder" data-id="${id}">Show in File Explorer</button>`];
    if (!p.gone) {
      menu.push(`<button data-act="send" data-id="${id}">Send changes now</button>`, `<button data-act="update" data-id="${id}">Update now</button>`,
        `<button data-act="sync" data-id="${id}" title="It syncs by itself; this just stops waiting.">Sync now</button>`, "<hr>",
        `<button data-act="unlink" data-id="${id}" title="The folder and its files stay on this computer. The project stays in the session." data-confirm="Stop syncing this project on this computer?\n\nYour files stay where they are, and the project stays in the session${p.shared ? " for " + esc(p.members.filter((m) => m !== state.user).join(", ")) : ""}. You can download it again later.">Stop syncing here</button>`);
      if (p.role === "owner") menu.push(`<button class="danger" data-act="delete" data-id="${id}" title="Removes it for everyone. No files are deleted." data-confirm="Remove &quot;${esc(p.name)}&quot; from the session for everyone?\n\nIts version history and comments are deleted from the server. Nobody's files are touched: your folder and ${p.shared ? "your friend's folder stay" : "its folder stays"} exactly as ${p.shared ? "they are" : "it is"}.\n\nThis cannot be undone.">Remove from Hénōsis</button>`);
    }
    mainBtns.push(`<details class="more" data-menu="${id}" ${openMenu === id ? "open" : ""}><summary aria-label="More actions" title="More actions">⋯</summary><div class="menu">${menu.join("")}</div></details>`);
    const toggles = !p.gone ? `<span class="toggles"><label><input type="checkbox" data-auto-send="${id}" ${p.auto_send ? "checked" : ""}> Auto-send</label>${tip("When on, every save in FL Studio is uploaded by itself.")}<label><input type="checkbox" data-auto-update="${id}" ${p.auto_update ? "checked" : ""}> Auto-update</label>${tip("When on, your friend's new versions are downloaded and applied by themselves.")}</span>` : "";
    let notes = "";
    if (p.conflicts.length) notes += `<div class="note">Two people changed the same file. Both versions were kept; listen to them and delete the one you do not need:<ul>${p.conflicts.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>`;
    const n = (list, one, many) => list.length === 1 ? one : `${list.length} ${many}`;
    if ((p.missing_samples || []).length) notes += `<div class="note">${n(p.missing_samples, "A sample", "samples")} this project uses ${p.missing_samples.length === 1 ? "is" : "are"} not on this computer yet:<ul>${p.missing_samples.slice(0, 6).map((c) => `<li>${esc(c)}</li>`).join("")}${p.missing_samples.length > 6 ? "<li>…</li>" : ""}</ul><div style="margin-top:6px">${p.missing_samples.length === 1 ? "It comes" : "They come"} over by itself as soon as Hénōsis is running on the computer that has ${p.missing_samples.length === 1 ? "it" : "them"}.</div></div>`;
    if (p.outside_samples.length) notes += `<div class="note">${n(p.outside_samples, "A sample", "samples")} could not be copied into the project, because a different file with the same name is already there:<ul>${p.outside_samples.slice(0, 6).map((c) => `<li>${esc(c)}</li>`).join("")}${p.outside_samples.length > 6 ? "<li>…</li>" : ""}</ul><div style="margin-top:6px">Rename one of them and use the renamed one in FL Studio, and it is copied in.</div></div>`;
    const people = p.shared ? "With " + p.members.filter((m) => m !== state.user).map(esc).join(", ") : "Only you so far";
    const sub = [`<span class="folder" title="${esc(p.folder)}">${esc(shortFolder(p.folder))}</span>`, `<span>${people}</span>`];
    if (p.last_sync) sub.push(`<span>Changed ${ago(p.last_sync)}</span>`);
    sub.push(`<span>Old versions kept ${p.retention_days || 3} days${p.role === "owner" ? ` (<a href="#" data-lifetime="${id}">change</a>)` : ""}</span>`);
    return `<div class="card pick ${esc(p.state)} ${id === selected ? "sel" : ""}" data-select="${id}" title="Click to see this project's history"><div class="top"><i class="led ${ledFor(p.state)}"></i><div class="name">${esc(p.name)}</div><div class="headline">${esc(p.busy || p.headline)}</div><div class="acts-main">${mainBtns.join("")}</div></div>
      ${p.detail ? `<div class="detail">${esc(p.detail)}</div>` : ""}${notes}<div class="sub">${sub.join("")}${toggles}</div>${b.length ? `<div class="row">${b.join("")}</div>` : ""}</div>`;
  }).join("");
}

function renderHistory() {
  const p = state.projects.find((x) => x.project_id === selected);
  const tools = document.getElementById("histTools"); if (!tools) return;
  tools.style.display = p ? "" : "none";
  document.getElementById("histBody").style.display = p ? "none" : "";
  if (!p) put("histBody", `<div class="detail" style="margin-left:0">Add a project to see its versions here.</div>`);
  put("histTitle", p ? `History of ${esc(p.name)}` : "History");
  if (!p) return;
  put("noteNow", p.next_note ? `Your next save will say: "${esc(p.next_note)}"` : "Without a note, the app describes the change itself.");
  if (p.gone) {
    document.getElementById("histTools").style.display = "none";
    document.getElementById("histBody").style.display = "";
    put("histBody", `<div class="detail" style="margin-left:0">This project is not in the session any more, so it has no history here. Your files are still in ${esc(p.folder)}.</div>`);
    return;
  }
  const list = historyFor === selected && history ? history.versions : null;
  if (!list) { put("versions", `<div class="meta" style="margin-left:0">Loading…</div>`); return; }
  if (!list.some((v) => v.id === commentOn)) commentOn = list.length ? list[0].id : null;
  const number = (v) => "version " + v.seq;
  put("versions", list.length ? list.map((v, i) => {
    const comments = history.comments.filter((c) => c.snapshot_id === v.id).map((c) => `<div class="c"><b>${esc(c.author)}</b> ${esc(c.text)}</div>`).join("");
    return `<div class="ver ${v.id === commentOn ? "target" : ""}"><div class="msg">${esc(v.message || "Saved")}</div>
      <div class="by">${esc(v.author)} · ${esc(new Date(v.created_at).toLocaleString())} · ${number(v)}${i === 0 ? " · current" : ""}${v.is_conflict ? " · conflict copy kept" : ""}${v.fl_version ? " · FL " + esc(v.fl_version) : ""}</div>
      ${comments}<div class="acts"><button data-comment-on="${v.id}">Comment</button>${i === 0 ? "" : `<button data-restore="${v.id}" data-id="${selected}">Restore</button>`}</div></div>`;
  }).join("") : `<div class="meta" style="margin-left:0">No versions yet. The first one appears when the project has files.</div>`);
  const target = list.find((v) => v.id === commentOn);
  put("commentLabel", target ? `Comment on ${number(target)} ("${esc(target.message || "Saved")}")` : "Comment");
}

async function refresh(force) {
  try { state = await api("/api/state"); render(); }
  catch (e) { if (force) toast("The Hénōsis app is not answering. Is it still running?", true); }
}
async function loadHistory() {
  if (!state || !selected) return;
  const id = selected;
  try { const out = await api(`/api/projects/${id}/history`); if (id === selected) { history = out; historyFor = id; renderHistory(); } } catch (e) {}
}
async function loadSuggestions() {
  if (!state || !state.signed_in) return;
  try { suggestions = (await api("/api/suggestions")).projects; render(); } catch (e) {}
}
function copyText(text, done) {
  const ok = () => toast(done);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => toast("Select the code and copy it by hand", true));
  else toast("Select the code and copy it by hand", true);
}

document.addEventListener("click", (e) => {
  const t = e.target; if (!(t instanceof HTMLElement)) return;
  // Theme switcher
  const themeBtn = t.closest("#themes button");
  if (themeBtn) { applyTheme(themeBtn.dataset.set); e.stopPropagation(); return; }
  // Close any open tooltip "?" when clicking elsewhere
  document.querySelectorAll(".tip.show").forEach((el) => { if (!el.contains(t)) el.classList.remove("show"); });
  // Toggle tooltip on click
  if (t.closest(".tip")) { const tip = t.closest(".tip"); tip.classList.toggle("show"); e.stopPropagation(); return; }
  const d = t.dataset;
  if (d.act) { if (d.confirm && !confirm(d.confirm)) return; if (t.closest("[data-auto-send],[data-auto-update]")) return; act(`/api/projects/${d.id}/${d.act}`); }
  else if (d.restore) { if (confirm("Bring this version back? The current one stays in the history.")) act(`/api/projects/${d.id}/restore`, {snapshot_id: d.restore}, () => toast("Restored")); }
  else if (d.commentOn) { commentOn = d.commentOn; renderHistory(); const box = $("#commentInput"); if (box) box.focus(); }
  else if (d.collect) act(`/api/projects/${d.collect}/collect`, {}, (out) => toast(`Copied ${out.copied ? out.copied.length : 0} sample(s).` + (out.notFound ? ` ${out.notFound.length} not found on this computer.` : "") + (out.clashes ? ` ${out.clashes.length} skipped because of a name clash.` : "")));
  else if (d.lifetime) { e.preventDefault(); const days = parseInt(prompt("Keep old versions for how many days? (1 to 365)", "3"), 10); if (days) act(`/api/projects/${d.lifetime}/lifetime`, {days}); }
  else if (d.link) act("/api/link", {project_id: d.link, folder: ""});
  else if (d.suggest) { const s = suggestions[+d.suggest]; if (s) act("/api/create", s.loose ? {file: s.file} : {folder: s.folder}, () => toast(`${s.name} added`)); }
  else if (t.id === "startSession") withProgress(state.previous_session ? "Opening your session" : "Starting your session", "Starting the session on this computer…", () => act("/api/host/start", {name: val("myName")}), "Windows may ask whether Hénōsis can use your network. Press Allow so friends on your Wi-Fi connect directly. If you press Cancel, they still connect, through the relay.");
  else if (t.id === "startNew") {
    const prev = state.previous_session || {people: [], projects: 0};
    if (confirm(`Start a new, empty session?\n\nThe old one (${prev.people.join(", ")}) is set aside in a folder on this computer, not deleted. Your project files stay where they are.\n\nFriends will need the new code.`)) withProgress("Starting a new session", "Setting the old one aside…", () => act("/api/host/start-new", {name: val("myName")}), "Windows may ask whether Hénōsis can use your network. Press Allow so friends on your Wi-Fi connect directly. If you press Cancel, they still connect, through the relay.");
  }
  else if (t.id === "joinSession") withProgress("Connecting to your friend", "Looking for your friend's computer…", () => act("/api/connect", {name: val("myName"), code: val("joinCode")}, () => toast("Connected")));
  else if (t.id === "login") act("/api/login", {server: val("server"), token: val("token")});
  else if (t.id === "copyCode") copyText(state.host.code, "Code copied. Send it to your friend.");
  else if (t.id === "saveExtra") act("/api/host/extra", {text: val("extraAddr")}, () => toast("The code now includes that address. Send the new code."));
  else if (t.id === "saveRelay") act("/api/host/relay", {text: val("relayUrl")}, () => toast(val("relayUrl") ? "Relay saved. Friends can now connect from anywhere." : "Relay turned off."));
  else if (t.id === "newCode") { if (confirm("Make a new code? The old code stops working for new friends. Everyone already connected stays connected.")) act("/api/host/new-code"); }
  else if (t.id === "hostStop") { if (confirm("Stop the session? Friends cannot sync until you start it again. The projects stay on this computer.")) act("/api/host/stop"); }
  else if (t.id === "addProject") pickFolder();
  else if (t.id === "create") act("/api/create", {folder: val("newFolder")}, () => { clear("newFolder"); toast("Project added"); });
  else if (t.id === "setNote") act(`/api/projects/${selected}/note`, {text: val("noteInput")}, () => clear("noteInput"));
  else if (t.id === "sendComment") { if (commentOn) act(`/api/projects/${selected}/comment`, {snapshot_id: commentOn, text: val("commentInput")}, () => clear("commentInput")); }
  else if (t.id === "autostart") act("/api/autostart", {on: state.autostart !== "on"});
  else if (t.id === "logout") { if (confirm("Leave the session on this computer? Your files stay.")) act("/api/logout"); }
  else if (t.id === "quit") { if (confirm("Quit Hénōsis? Projects stop syncing until it is started again.")) act("/api/quit", {}, () => { document.body.innerHTML = '<main><div class="card">Hénōsis has stopped. You can close this window.</div></main>'; }); }
  else if (t.id === "copyLog") copyText(logLines.map((l) => `${l.time} ${l.level.toUpperCase().padEnd(5)} ${l.text}`).join("\n"), "Console copied");
  else if (t.id === "clearLog") { logLines = []; errorsSeen = 0; drawLog(); }
  else if (t.id === "toggleLog" || (t.closest("#consoleBar") && !t.closest("button, label, input"))) toggleConsole();
  else if (t.id === "detail") { drawLog(); saveConsole(); }
  else { const card = t.closest("[data-select]"); if (card && !t.closest("button, a, input, label, details") && card.dataset.select !== selected) { selected = card.dataset.select; history = null; render(); loadHistory(); } }
  // A press inside a menu, or anywhere outside it, closes it.
  document.querySelectorAll("details.more[open], #sessionMore[open]").forEach((d) => { if (!d.contains(t) || (t.closest("button") && d.querySelector(".menu,.panel")?.contains(t) && d.classList.contains("more"))) { d.open = false; if (d.dataset.menu === openMenu) openMenu = null; } });
});
// A card's ⋯ menu stays open across the page's refreshes.
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.menu) return;
  if (d.open) { openMenu = d.dataset.menu; document.querySelectorAll("details.more[open]").forEach((o) => { if (o !== d) o.open = false; }); }
  else if (openMenu === d.dataset.menu) openMenu = null;
}, true);
// Auto-send / auto-update toggle handler.
document.addEventListener("change", (e) => {
  const t = e.target; if (!(t instanceof HTMLInputElement)) return;
  const pid = t.dataset.autoSend || t.dataset.autoUpdate;
  if (!pid) return;
  const p = state.projects.find((x) => x.project_id === pid);
  if (!p) return;
  const autoSend = t.dataset.autoSend ? t.checked : p.auto_send;
  const autoUpdate = t.dataset.autoUpdate ? t.checked : p.auto_update;
  act(`/api/projects/${pid}/auto`, {auto_send: autoSend, auto_update: autoUpdate}, () => toast(autoSend && autoUpdate ? "Auto-send and auto-update on" : autoSend ? "Auto-send on, auto-update off" : autoUpdate ? "Auto-send off, auto-update on" : "Auto-send and auto-update off"));
});
// Enter in a field presses the button that belongs to it.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !(e.target instanceof HTMLInputElement)) return;
  const partner = {myName: document.getElementById("startNew") ? "startNew" : "startSession", joinCode: "joinSession", token: "login", newFolder: "create", noteInput: "setNote", commentInput: "sendComment", extraAddr: "saveExtra", relayUrl: "saveRelay"}[e.target.id];
  if (partner && document.getElementById(partner)) document.getElementById(partner).click();
});

// The console keeps the height and the open or closed state you left it at.
function loadConsole() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("console") || "{}"); } catch (e) {}
  if (saved.height) $("#lines").style.height = saved.height + "px";
  // Closed unless you left it open.
  const open = saved.closed === false;
  $("#console").classList.toggle("closed", !open);
  $("#toggleLog").textContent = open ? "Close" : "Open";
  if (saved.detail) $("#detail").checked = true;
}
function saveConsole() {
  try {
    localStorage.setItem("console", JSON.stringify({height: parseInt($("#lines").style.height, 10) || null,
      closed: $("#console").classList.contains("closed"), detail: $("#detail").checked}));
  } catch (e) {}
}
// Dragging the strip above the console makes it taller or shorter.
(function () {
  let startY = 0, startHeight = 0;
  const move = (e) => {
    const height = Math.min(Math.max(startHeight + (startY - e.clientY), 40), window.innerHeight - 160);
    $("#lines").style.height = height + "px";
  };
  const stop = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", stop);
    $("#grip").classList.remove("dragging");
    saveConsole();
  };
  document.addEventListener("mousedown", (e) => {
    if (!(e.target instanceof HTMLElement) || e.target.id !== "grip") return;
    e.preventDefault();
    startY = e.clientY;
    startHeight = $("#lines").getBoundingClientRect().height;
    $("#grip").classList.add("dragging");
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", stop);
  });
})();

// A browser never tells a page where a folder is on disk, so the window sends
// the folder's name and what is inside it, and the app finds it.
async function addFolder(name, files) {
  if (busy) return;
  const label = name || (files[0] && files[0].name) || "that";
  toast(`Looking for ${label} on this computer…`);
  await act("/api/drop", {name, files}, (link) => toast(`${link.name} added from ${link.folder}`));
}
async function pickFolder() {
  if (!window.showDirectoryPicker) {
    toast("This window cannot open a folder picker. Drag the folder in, or paste its path below.", true);
    return;
  }
  let dir;
  try { dir = await window.showDirectoryPicker({mode: "read", id: "henosis-project"}); }
  catch (e) { return; } // the user closed the picker
  const files = [];
  try {
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind !== "file" || files.length >= 50) continue;
      const file = await handle.getFile();
      files.push({name, size: file.size});
    }
  } catch (e) {}
  await addFolder(dir.name, files);
}
// What a drag carries: a folder (its top-level files), or a single file.
async function readDrop(transfer) {
  const items = [...(transfer.items || [])].filter((i) => i.kind === "file");
  const entry = items.length && items[0].webkitGetAsEntry ? items[0].webkitGetAsEntry() : null;
  if (entry && entry.isDirectory) {
    const files = await new Promise((done) => {
      entry.createReader().readEntries((entries) => {
        const out = [], wanted = entries.filter((e) => e.isFile).slice(0, 50);
        if (!wanted.length) return done(out);
        let left = wanted.length;
        wanted.forEach((e) => e.file((f) => { out.push({name: e.name, size: f.size}); if (!--left) done(out); }, () => { if (!--left) done(out); }));
      }, () => done([]));
    });
    return {name: entry.name, files};
  }
  const file = transfer.files && transfer.files[0];
  if (file) return {name: "", files: [{name: file.name, size: file.size}]};
  return null;
}
["dragenter", "dragover"].forEach((type) => document.addEventListener(type, (e) => {
  if (!state || !state.signed_in || !e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
  document.body.classList.add("dragging");
  const zone = document.getElementById("drop");
  if (zone) zone.classList.toggle("over", !!e.target.closest && !!e.target.closest("#drop"));
}));
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) stopDragging(); });
function stopDragging() {
  document.body.classList.remove("dragging");
  const zone = document.getElementById("drop");
  if (zone) zone.classList.remove("over");
}
document.addEventListener("drop", async (e) => {
  if (!state || !state.signed_in || !e.dataTransfer) return;
  e.preventDefault();
  stopDragging();
  const dropped = await readDrop(e.dataTransfer);
  if (!dropped) { toast("Drag the project's folder, or its .flp file", true); return; }
  await addFolder(dropped.name, dropped.files);
});

function toggleConsole() {
  const c = $("#console"); c.classList.toggle("closed");
  $("#toggleLog").textContent = c.classList.contains("closed") ? "Open" : "Close";
  errorsSeen = 0; drawLog(); saveConsole();
}
function drawLog() {
  const box = $("#lines"), detail = $("#detail").checked, atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = logLines.filter((l) => detail || l.level !== "debug").map((l) => `<div class="${esc(l.level)}"><span>${esc(l.time)}</span> ${l.level === "error" ? "ERROR " : ""}${esc(l.text)}</div>`).join("");
  if (atEnd) box.scrollTop = box.scrollHeight;
  $("#count").textContent = $("#console").classList.contains("closed") && errorsSeen ? errorsSeen + " new error" + (errorsSeen > 1 ? "s" : "") : "";
  const last = logLines.filter((l) => detail || l.level !== "debug").slice(-1)[0];
  $("#lastLine").textContent = last ? `${last.time}  ${last.text}` : "";
}
function addLocal(level, text) { logLines.push({time: new Date().toTimeString().slice(0, 8), level, text}); if (level === "error") errorsSeen++; drawLog(); }
async function pollLog() {
  try {
    const out = await api("/api/logs?after=" + logSeq);
    if (pollLog.lost) { addLocal("info", "window: the app answers again"); pollLog.lost = false; }
    if (!out.entries.length) return;
    for (const e of out.entries) { logSeq = e.seq; logLines.push(e); if (e.level === "error") errorsSeen++; }
    if (logLines.length > 3000) logLines = logLines.slice(-2000);
    drawLog();
  } catch (e) { if (!pollLog.lost) { addLocal("error", "window: the app does not answer (" + e.message + ")"); pollLog.lost = true; } }
}
function reportUiError(text) { addLocal("error", "window: " + text); fetch("/api/ui-error", {method: "POST", headers: {"Content-Type": "application/json", "X-Henosis": "1"}, body: JSON.stringify({text})}).catch(() => {}); }
window.addEventListener("error", (e) => reportUiError(`${e.message} (line ${e.lineno})`));
window.addEventListener("unhandledrejection", (e) => reportUiError(String(e.reason && e.reason.message || e.reason)));
loadConsole();
applyTheme(savedTheme);
refresh(true).then(() => { loadHistory(); loadSuggestions(); });
setInterval(refresh, 2000); setInterval(loadHistory, 3000); setInterval(loadSuggestions, 15000); pollLog(); setInterval(pollLog, 1000);
</script>
